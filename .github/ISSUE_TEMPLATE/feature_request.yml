name: Feature request
description: Propose something new or a change in behaviour.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the app does not let you do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work? Where in the UI? Any admin prompt, driver or service it would need?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: implement
    attributes:
      label: Would you like to implement it?
      options:
        - "Yes, assign it to me once agreed"
        - "No, just proposing"
    validations:
      required: true
