name: TTL build check

# Verifies the TTL feature: tests on Linux, and the full Windows bundle with
# the WinDivert driver (the only place the driver is fetched).
on:
  push:
    branches: [ttl-normalize]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  bundle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Fetch WinDivert and place the driver next to the resources
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/basil00/WinDivert/releases/download/v2.2.2/WinDivert-2.2.2-A.zip -OutFile wd.zip
          Expand-Archive wd.zip -DestinationPath wd
          $x64 = "$PWD\wd\WinDivert-2.2.2-A\x64"
          "WINDIVERT_PATH=$x64" | Out-File -FilePath $env:GITHUB_ENV -Append
          New-Item -ItemType Directory -Force -Path src-tauri\windivert | Out-Null
          Copy-Item "$x64\WinDivert.dll","$x64\WinDivert64.sys" src-tauri\windivert\
      - run: pnpm install --frozen-lockfile
      - name: Build the Windows bundle with TTL
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINDIVERT_PATH: ${{ env.WINDIVERT_PATH }}
        with:
          args: "--features ttl"
      - uses: actions/upload-artifact@v4
        with:
          name: ttl-bundle
          path: |
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe
          if-no-files-found: ignore
