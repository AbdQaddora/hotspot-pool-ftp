name: TTL build check

# Compiles the WinDivert TTL glue on Windows (the only place the driver is
# fetched). Runs on the ttl-normalize branch and on demand.
on:
  push:
    branches: [ttl-normalize]
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Download WinDivert
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/basil00/WinDivert/releases/download/v2.2.2/WinDivert-2.2.2-A.zip -OutFile wd.zip
          Expand-Archive wd.zip -DestinationPath wd
          "WINDIVERT_PATH=$PWD\wd\WinDivert-2.2.2-A\x64" | Out-File -FilePath $env:GITHUB_ENV -Append
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Cargo build with the ttl feature
        run: cargo build --manifest-path src-tauri/Cargo.toml --features ttl
