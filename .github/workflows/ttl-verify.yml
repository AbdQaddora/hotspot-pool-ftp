name: TTL build check

# Builds the Windows bundle with the WinDivert TTL feature (the only place the
# driver is fetched). Runs on the ttl-normalize branch and on demand.
on:
  push:
    branches: [ttl-normalize]
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Fetch WinDivert and place the driver next to the resources
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/basil00/WinDivert/releases/download/v2.2.2/WinDivert-2.2.2-A.zip -OutFile wd.zip
          Expand-Archive wd.zip -DestinationPath wd
          $x64 = "$PWD\wd\WinDivert-2.2.2-A\x64"
          "WINDIVERT_PATH=$x64" | Out-File -FilePath $env:GITHUB_ENV -Append
          New-Item -ItemType Directory -Force -Path src-tauri\windivert | Out-Null
          Copy-Item "$x64\WinDivert.dll","$x64\WinDivert64.sys" src-tauri\windivert\
      - run: pnpm install --frozen-lockfile
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build the Windows bundle with TTL
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINDIVERT_PATH: ${{ env.WINDIVERT_PATH }}
        with:
          args: "--features ttl"
      - uses: actions/upload-artifact@v4
        with:
          name: ttl-bundle
          path: |
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe
          if-no-files-found: ignore
