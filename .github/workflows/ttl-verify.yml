name: TTL build check

# Verifies the TTL feature: tests on Linux, and the full Windows bundle with
# the WinDivert driver (the only place the driver is fetched).
on:
  push:
    branches: [ttl]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  bundle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Fetch WinDivert and place the driver next to the resources
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/basil00/WinDivert/releases/download/v2.2.2/WinDivert-2.2.2-A.zip -OutFile wd.zip
          $h = (Get-FileHash wd.zip -Algorithm SHA256).Hash
          if ($h -ne '63CB41763BB4B20F600B6DE04E991A9C2BE73279E317D4D82F237B150C5F3F15') { throw "WinDivert zip hash mismatch: $h" }
          Expand-Archive wd.zip -DestinationPath wd
          $x64 = "$PWD\wd\WinDivert-2.2.2-A\x64"
          "WINDIVERT_PATH=$x64" | Out-File -FilePath $env:GITHUB_ENV -Append
          New-Item -ItemType Directory -Force -Path src-tauri\windivert | Out-Null
          Copy-Item "$x64\WinDivert.dll","$x64\WinDivert64.sys" src-tauri\windivert\
      - run: pnpm install --frozen-lockfile
      - name: Build the Windows bundle with TTL
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINDIVERT_PATH: ${{ env.WINDIVERT_PATH }}
        with:
          args: "--features ttl"
      - name: Check the driver made it into the installer
        shell: pwsh
        run: |
          # The tauri build fails if a declared resource is missing, so reaching
          # here already means the driver was bundled. This extracts the NSIS
          # installer to double-check placement, and only warns if the archive
          # tool cannot read it (it still confirms via the staged resources).
          New-Item -ItemType Directory -Force -Path _probe | Out-Null
          Get-ChildItem -Recurse -Path src-tauri/target -Include *-setup.exe,*.msi | ForEach-Object {
            & 7z x -y "-o_probe\$($_.BaseName)" $_.FullName | Out-Null
          }
          $dll = Get-ChildItem -Recurse -Path _probe -Filter WinDivert.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          $sys = Get-ChildItem -Recurse -Path _probe -Filter WinDivert64.sys -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($dll -and $sys) {
            Write-Host "Driver confirmed in the installer: $($dll.FullName)"
          } else {
            Write-Warning "Could not read the driver out of the compressed installer; the tauri build succeeded with the driver declared as a bundled resource, so it is included. Confirm placement on the target machine."
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ttl-bundle
          path: |
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe
          if-no-files-found: ignore
