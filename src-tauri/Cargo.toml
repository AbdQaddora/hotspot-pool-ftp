[package]
name = "hotspot-pool-ftp"
version = "0.5.0"
description = "Share local files over FTP on your laptop's Wi-Fi hotspot"
authors = ["AbdQaddora"]
edition = "2021"
license = "MIT"

[lib]
name = "hotspot_pool_ftp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "fs", "io-util", "sync", "time", "macros"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
tokio-util = { version = "0.7", features = ["io"] }
mime_guess = "2"
percent-encoding = "2"
rand = "0.9"

if-addrs = "0.15"
log = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Collections",
  "Networking_Connectivity",
  "Networking_NetworkOperators",
  "Win32_System_WinRT",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
debug = false
incremental = false

[profile.dev]
opt-level = 1

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
